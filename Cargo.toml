[package]
name = "glowframe"
version = "0.1.9"
edition = "2024"
description = "Spotify now-playing fullscreen mode with a beat-reactive glow frame"
license = "MIT"
repository = "https://github.com/CallMeFriedrich/glowframe"
publish = false

[dependencies]
egui = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false }
egui_glow = { version = "0.37.0", default-features = false }
global-hotkey = "0.10.0"
glow = "0.17"
glutin = { version = "0.32.3", default-features = false, features = ["wgl"] }
realfft = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tray-icon = "0.26.1"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default", "gzip"] }
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
windows-numerics = "0.3.1"
# Windows only: wayland/x11 defaults are not needed.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[build-dependencies]
embed-resource = "3"
